  admin_inactivity_days: 45
  feature_adoption_drop_pct: 0.25
  feature_slope_threshold: -0.04
  high_severity_ticket_window: 4
  high_severity_ticket_min: 3
  nps_drop: 15
  nps_absolute_low: 30
