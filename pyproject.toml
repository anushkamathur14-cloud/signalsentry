[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalsentry"
version = "0.1.0"
description = "Local-first AI-assisted churn early warning and paid-media anomaly investigation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "streamlit>=1.32",
  "plotly>=5.18",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
